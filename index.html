<!-- CONTROLS -->
<div class="controls">

<button
class="toggle"
id="langBtn"
>
🌐 Switch Language
</button>

<input
type="text"
id="search"
placeholder="Search item..."
>

<select id="filter">

<option value="all">
All
</option>

<option value="rice">
Rice
</option>

<option value="dal">
Dal
</option>

<option value="meat">
Meat
</option>

<option value="veg">
Vegetable
</option>

<option value="raita">
Raita
</option>

<option value="other">
Other
</option>

</select>

</div>

<!-- RECIPE LIST -->
<div id="list"></div>

<!-- WATER CALCULATOR -->
<div class="section">

<h2 id="calcTitle">
🧮 Water Calculator
</h2>

<select id="item">

<option value="rice">
Rice
</option>

<option value="dal">
Dal
</option>

<option value="meat">
Meat
</option>

<option value="chana">
Chana
</option>

<option value="dough">
Dough
</option>

</select>

<input
type="number"
id="amount"
placeholder="Enter amount"
>

<button id="calcBtn">
Calculate
</button>

<div id="result"></div>

</div>

</div>

<script src="script.js"></script>
